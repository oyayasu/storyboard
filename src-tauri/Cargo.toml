[package]
name = "storyboard-studio"
version = "0.3.12"
description = "Local storyboard workflow tool"
authors = ["Filipe"]
edition = "2021"

[lib]
name = "storyboard_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"
